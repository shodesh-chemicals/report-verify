<script>
    const RECORDS = {
      "SSA-09-26-012|RG-1012": "sample-report.pdf" // SSA-09-26-012_Rg-1012
    };

    async function verifyReport() {
      const reportNo = document.getElementById('reportNo').value.trim().toUpperCase();
      const labId = document.getElementById('labId').value.trim().toUpperCase();
      const resultDiv = document.getElementById('result');

      if (!reportNo || !labId) {
        resultDiv.innerHTML = '<span class="error">Please enter both Report No. and Lab ID.</span>';
        return;
      }

      const key = `${reportNo}|${labId}`;
      const filePath = RECORDS[key];

      if (!filePath) {
        resultDiv.innerHTML = '<span class="error">Invalid Report No. or Lab ID. Record not found.</span>';
        return;
      }

      resultDiv.innerHTML = 'Checking record...';

      try {
        const res = await fetch(filePath, { method: 'HEAD' });
        if (res.ok) {
          resultDiv.innerHTML = `
            <div class="success-box">
              <strong>Verified Authentic Report</strong><br/>
              <a class="btn-link" href="${filePath}" target="_blank">View PDF</a>
              <a class="btn-link" href="${filePath}" download="${reportNo}_${labId}.pdf">Download PDF</a>
            </div>`;
        } else {
          resultDiv.innerHTML = '<span class="error">PDF file not found in repository.</span>';
        }
      } catch (err) {
        resultDiv.innerHTML = '<span class="error">Verification failed. Please try again.</span>';
      }
    }
  </script>
